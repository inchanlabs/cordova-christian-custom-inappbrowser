ext {
    kotlin_version = '2.1.0'
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core-ktx:1.12.0'
    }
}

// Safely configure Kotlin compilation tasks without referencing 'org' directly
tasks.withType(getTasks().findByName("compileReleaseKotlin")?.class ?: Object).configureEach {
    kotlinOptions {
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }
}

// Global fallback to suppress metadata version mismatches across all Kotlin compilation tasks
gradle.projectsEvaluated {
    tasks.withType(GroovyObject).configureEach { task ->
        if (task.name.toLowerCase().contains("kotlin")) {
            try {
                task.kotlinOptions.freeCompilerArgs += ["-Xskip-metadata-version-check"]
            } catch (Exception ignored) {
                // Ignore tasks that do not expose kotlinOptions
            }
        }
    }
}
